name: release

on:
  workflow_call:
    inputs:
      changelog:
        description: Write CHANGELOG.md on the release PR
        type: boolean
        default: true
      target-branch:
        description: Branch to open the release PR against. Defaults to the branch that triggered the caller.
        type: string
        required: false
        default: ''
    secrets:
      token:
        description: Token with contents and pull-request write. Defaults to github.token.
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: echolang/setup-echo/release@v1
        with:
          changelog: ${{ inputs.changelog }}
          target-branch: ${{ inputs.target-branch }}
          token: ${{ secrets.token || github.token }}

name: release

on:
  workflow_call:
    inputs:
      changelog:
        description: Write CHANGELOG.md on the release PR
        type: boolean
        default: true
      target-branch:
        description: Branch to open the release PR against. Defaults to the branch that triggered the caller.
        type: string
        required: false
        default: ''
      extra-files:
        description: More files whose `x-release-please-version` line is bumped with module.eco, one per line or comma separated
        type: string
        required: false
        default: ''
    outputs:
      release-created:
        description: '`true` when this run tagged a new GitHub release'
        value: ${{ jobs.release.outputs.release-created }}
      tag-name:
        description: The tag of that release, e.g. v0.1.3. Empty when none was created.
        value: ${{ jobs.release.outputs.tag-name }}
      version:
        description: The version of that release, e.g. 0.1.3. Empty when none was created.
        value: ${{ jobs.release.outputs.version }}
    secrets:
      token:
        description: Token with contents and pull-request write. Defaults to github.token.
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
      tag-name: ${{ steps.release.outputs.tag-name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: echolang/setup-echo/release@v1
        id: release
        with:
          changelog: ${{ inputs.changelog }}
          target-branch: ${{ inputs.target-branch }}
          extra-files: ${{ inputs.extra-files }}
          token: ${{ secrets.token || github.token }}
